# Public benchmarks for digital and consumer-lending banks, compared with the Bank X model (year 5).
# Amounts in millions of the reporting currency (not converted); ratios as decimals (0.123 = 12.3%);
# customers in millions. Each value has a source (URL plus page) or needs_check: true.
# "Computed" in a note means the company does not report the ratio and it was calculated from reported lines.

title: "Digital and consumer-lending banks: public benchmarks vs Bank X"
as_of: 2026-10-31

fx:
  # ECB euro reference rates, 31.12.2025, used only to compare sizes. Ratios are never converted.
  GBP:
    eur_per_unit: 1.14600   # 1 / 0.8726 GBP per EUR
    date: 2025-12-31
    source: "https://data-api.ecb.europa.eu/service/data/EXR/D.GBP.EUR.SP00.A?startPeriod=2025-12-31&endPeriod=2025-12-31&format=csvdata"
  SEK:
    eur_per_unit: 0.092409  # 1 / 10.8215 SEK per EUR
    date: 2025-12-31
    source: "https://data-api.ecb.europa.eu/service/data/EXR/D.SEK.EUR.SP00.A?startPeriod=2025-12-31&endPeriod=2025-12-31&format=csvdata"

metrics:
  total_assets: {label: Total assets, kind: amount, description: "Total assets at year end"}
  loans: {label: Loans, kind: amount, description: "Loans to customers at year end (gross where reported)"}
  deposits: {label: Deposits, kind: amount, description: "Customer deposits at year end"}
  equity: {label: Equity, kind: amount, description: "Total equity at year end"}
  total_income: {label: Total income, kind: amount, description: "Net interest + net fee + other income, before costs and credit losses"}
  net_profit: {label: Net profit, kind: amount, description: "Profit after tax for the year"}
  roe: {label: ROE, kind: ratio, description: "Net profit / average equity"}
  cost_income: {label: Cost / income, kind: ratio, description: "Operating expenses / total income, excluding credit losses"}
  cost_of_risk: {label: Cost of risk, kind: ratio, description: "Credit loss charge / average loans"}
  nim: {label: NIM, kind: ratio, description: "Net interest margin as reported (definitions differ, see notes)"}
  loan_yield: {label: Loan yield, kind: ratio, description: "Interest income on loans / average loans"}
  fee_share: {label: Fees / income, kind: ratio, description: "Net fee and commission income / total income"}
  customers: {label: Customers, kind: count, description: "Customers in millions (definitions differ, see notes)"}

