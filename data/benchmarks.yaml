# Public benchmarks for digital banks and deposit-funded lenders, compared with the Bank X model (year 5).
# Amounts in millions of the reporting currency (not converted); ratios as decimals (0.123 = 12.3%);
# customers in millions. Each value has a source URL or needs_check: true. Page numbers are PDF page numbers
# where given; customer counts and the Bank X rows have no page.
# "Computed" at the start of a note means the company does not report the ratio on this basis and it was
# calculated from reported lines; the note lists the inputs and pages.
# Loans are net loans to customers from the balance sheet for every bank.
# Fees / income is net fee and commission income / total net operating income for every bank.

title: "Digital banks and deposit-funded lenders: public benchmarks vs Bank X"
as_of: 2026-11-15

fx:
  # ECB euro reference rates, 31.12.2025, used only to compare sizes. Ratios are never converted.
  GBP:
    eur_per_unit: 1.14600   # 1 / 0.8726 GBP per EUR
    date: 2025-12-31
    source: "https://data-api.ecb.europa.eu/service/data/EXR/D.GBP.EUR.SP00.A?startPeriod=2025-12-31&endPeriod=2025-12-31&format=csvdata"
  SEK:
    eur_per_unit: 0.092409  # 1 / 10.8215 SEK per EUR
    date: 2025-12-31
    source: "https://data-api.ecb.europa.eu/service/data/EXR/D.SEK.EUR.SP00.A?startPeriod=2025-12-31&endPeriod=2025-12-31&format=csvdata"

metrics:
  total_assets: {label: Total assets, kind: amount, description: "Total assets at year end"}
  loans: {label: Loans, kind: amount, description: "Net loans to customers on the balance sheet at year end"}
  deposits: {label: Deposits, kind: amount, description: "Customer deposits at year end"}
  equity: {label: Equity, kind: amount, description: "Total equity at year end"}
  equity_prev: {label: Equity, prior year, kind: amount, description: "Total equity at the previous year end, used to check ROE"}
  total_income: {label: Total income, kind: amount, description: "Total net operating income: net interest + net fee + other income, before costs and credit losses"}
  net_profit: {label: Net profit, kind: amount, description: "Profit after tax for the year"}
  roe: {label: ROE, kind: ratio, description: "Net profit / average equity (TF Bank: on equity excluding its Tier 1 instrument)"}
  roe_core: {label: ROE excl. one-offs, kind: ratio, description: "ROE excluding one-off items, as reported by the company"}
  cost_income: {label: Cost / income, kind: ratio, description: "Operating expenses / total net operating income, excluding credit losses (statutory, not adjusted)"}
  cost_of_risk: {label: Cost of risk, kind: ratio, description: "Credit loss charge / average loans"}
  nim: {label: NIM, kind: ratio, description: "Net interest margin as reported (definitions differ, see notes)"}
  loan_yield: {label: Loan yield, kind: ratio, description: "Interest income on loans to customers / average loans"}
  fee_share: {label: Fees / income, kind: ratio, description: "Net fee and commission income / total net operating income"}
  consumer_loan_share: {label: Consumer loans / portfolio, kind: ratio, description: "Unsecured consumer loans as a share of the loan portfolio"}
  mortgages: {label: Mortgages, kind: amount, description: "Mortgage loans included in loans"}
  municipal_loans: {label: Municipal loans, kind: amount, description: "Loans to municipalities included in loans"}
  customers: {label: Customers, kind: count, description: "Customers in millions (definitions differ, see notes)"}

